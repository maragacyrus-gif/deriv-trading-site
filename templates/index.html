

{% extends 'base.html' %}

{% block content %}
<!-- Visual Console Display Node for Strategy Feedback -->
<div class="grid-box">
    <h2 style="margin-top: 0; color: #f1f5f9; font-size: 16px;">📊 Defensive Strategy Feed Logs (1-3-2-6 Safe Unit Mode)</h2>
    <div id="terminallog">⚡ Core system standby. Initializing connection feed downstream...</div>
</div>

<!-- Dynamic Performance Tracker Widgets -->
<div style="display: flex; gap: 15px; margin-top: 20px;">
    <div class="grid-box" style="flex: 1; text-align: center;">
        <h3 style="margin: 0 0 10px 0; font-size: 14px; color: #94a3b8;">Session Shift Status</h3>
        <div id="ui-profit" style="font-size: 24px; font-weight: bold; color: #10b981;">$0.00</div>
    </div>
    <div class="grid-box" style="flex: 1; text-align: center;">
        <h3 style="margin: 0 0 10px 0; font-size: 14px; color: #94a3b8;">Current Layer Unit Cost</h3>
        <div id="ui-stake" style="font-size: 24px; font-weight: bold; color: #38bdf8;">$0.35</div>
    </div>
</div>

<!-- Interface Stream Interception Hook Script -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const terminal = document.getElementById("terminallog");
        const profitUi = document.getElementById("ui-profit");
        const stakeUi = document.getElementById("ui-stake");

        // Helper function to append clean logs directly into the visual window view
        function logToScreen(text) {
            const timestamp = new Date().toLocaleTimeString();
            let color = '#38bdf8'; // Default process blue
            
            if (text.includes('✅') || text.includes('Closed! Outcome: WON')) color = '#10b981'; // Success green
            if (text.includes('❌') || text.includes('⚠️')) color = '#f43f5e'; // Warning red
            
            terminal.innerHTML += `<div style="color: ${color}; margin-bottom: 4px;">[${timestamp}] ${text}</div>`;
            terminal.scrollTop = terminal.scrollHeight; // Keep log locked to the latest update
        }

        // Hook directly into the standard console window parameters to capture app.js outputs
        const originalLog = console.log;
        const originalError = console.error;

        console.log = function(...args) {
            originalLog.apply(console, args);
            const msg = args.join(' ');
            logToScreen(msg);

            // Dynamically strip data elements to keep metric UI cards updated
            if (msg.includes("Total Portfolio:")) {
                const extraction = msg.split("Total Portfolio: $")[1];
                if (extraction) profitUi.innerText = `$${extraction}`;
            }
            if (msg.includes("Next Stake: $")) {
                const extraction = msg.split("Next Stake: $")[1];
                if (extraction) stakeUi.innerText = `$${extraction}`;
            }
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            logToScreen(`⚠️ System Alert: ${args.join(' ')}`);
        };
    });
</script>
{% endblock %}
