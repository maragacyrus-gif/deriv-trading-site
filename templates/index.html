{% extends "base.html" %}
{% block content %}
<style>
    .grid-container { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 1100px) { .grid-container { grid-template-columns: 1fr 3fr; } }
    .card { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .panel-title { font-size: 0.75rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
    label { font-size: 0.75rem; color: #94a3b8; font-weight: 600; }
    select, input { w-full: 100%; width: 100%; background-color: #020617; border: 1px solid #1e293b; color: #e2e8f0; border-radius: 8px; padding: 8px 12px; font-size: 0.875rem; margin-top: 4px; }
    .bot-box { background-color: #020617; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
    .bot-text span { display: block; font-size: 0.75rem; font-weight: 700; }
    .bot-text small { color: #64748b; font-size: 10px; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-action { padding: 12px; border: none; border-radius: 12px; font-weight: 700; color: white; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }
    .btn-rise { background-color: #10b981; }
    .btn-fall { background-color: #f43f5e; }
    .chart-panel { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .chart-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.875rem; }
    #livePriceDisplay { font-family: monospace; color: #94a3b8; font-weight: 800; }
    #chartContainer { width: 100%; min-height: 350px; background-color: #020617; border: 1px solid #0f172a; border-radius: 8px; }
    .log-panel { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; height: 180px; display: flex; flex-direction: column; }
    #terminalLog { flex: 1; overflow-y: auto; background-color: #020617; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 0.75rem; display: flex; flex-direction: column; gap: 4px; }
</style>

<div class="grid-container">
    <div style="display: flex; flex-direction: column; gap: 16px;">
        <div class="card">
            <div class="panel-title">Market Settings</div>
            <div>
                <label>Synthetic Index Underlier</label>
                <select id="assetSelector">
                    <option value="1HZ10V" selected>Volatility 10 Index</option>
                    <option value="1HZ50V">Volatility 50 Index</option>
                    <option value="1HZ100V">Volatility 100 Index</option>
                </select>
            </div>
            <div>
                <label>Trade Stake Volume ($)</label>
                <input id="tradeStake" type="number" value="1.00" step="0.50">
            </div>
            <div class="bot-box">
                <div class="bot-text">
                    <span>Algorithmic Bot Cycle</span>
                    <small>Executes automated rules</small>
                </div>
                <input id="botToggle" type="checkbox" style="width: auto; margin: 0; cursor: pointer;">
            </div>
        </div>
        <div class="btn-row">
            <button id="btnRise" class="btn-action btn-rise">Rise / Call</button>
            <button id="btnFall" class="btn-action btn-fall">Fall / Put</button>
        </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px;">
        <div class="chart-panel">
            <div class="chart-header">
                <span id="chartSymbolDisplay">VOLATILITY 10 INDEX</span>
                <span id="livePriceDisplay">0.0000</span>
            </div>
            <div id="chartContainer"></div>
        </div>
        <div class="log-panel">
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px; align-items: center;">
                <label class="panel-title" style="border:none; padding:0;">System Log</label>
                <button id="btnClearLogs" style="background: none; border: none; color: #64748b; font-size: 10px; cursor: pointer;">Flush Logs</button>
            </div>
            <div id="terminalLog"></div>
        </div>
    </div>
</div>
<script src="/static/js/app.js"></script>
{% endblock %}
