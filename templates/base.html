<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Engine Platform</title>
    <!-- Fallback raw styling overrides to protect dark theme if CDN fails -->
    <style>
        body { background-color: #020617 !important; color: #f1f5f9 !important; font-family: sans-serif; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; }
        button { background-color: #4f46e5; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        select, input { background-color: #0f172a; color: white; border: 1px solid #334155; padding: 8px; border-radius: 6px; margin: 5px 0; width: 100%; max-width: 300px; }
        .grid-box { background-color: #0f172a; border: 1px solid #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        #terminalLog { background-color: #020617; border: 1px solid #1e293b; padding: 10px; height: 120px; overflow-y: auto; font-family: monospace; font-size: 12px; border-radius: 6px; }
        .btn-rise { background-color: #059669; }
        .btn-fall { background-color: #dc2626; }
    </style>
    <!-- High-speed alternative script distribution nodes -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <header>
        <div>
            <span style="font-size: 18px; font-weight: bold; tracking-content: wide;">QUANTUM<span style="color:#818cf8;">TRADE</span></span>
        </div>
        <div>
            <span style="font-size: 12px; color: #94a3b8; margin-right: 10px;">Network: <span id="connectionStatus" style="color:#ef4444; font-weight:bold;">Offline</span></span>
            <span id="oauthSection">
                <button id="btnConnectAccount">Link Deriv Account (OAuth2)</button>
            </span>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer style="margin-top: 30px; border-top: 1px solid #1e293b; padding-top: 10px; font-size: 10px; color: #64748b; text-align: center;">
        <p><strong>HIGH-RISK FINANCIAL DISCLAIMER:</strong> Automated systems carry risk. Users maintain complete independent liability.</p>
    </footer>
</body>
</html>
